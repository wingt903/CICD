# inventory.ini – Static inventory for the Tomcat demo deployment.
#
# Replace the placeholder values below with your actual EC2 details:
#   - ansible_host : public IP or DNS name of your EC2 instance
#   - ansible_user : SSH user (ec2-user for Amazon Linux, ubuntu for Ubuntu)
#   - ansible_ssh_private_key_file : path to the .pem key downloaded from AWS

[tomcat]
tomcat-demo ansible_host=<EC2_PUBLIC_IP_OR_DNS> ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/<YOUR_KEY>.pem

[tomcat:vars]
ansible_python_interpreter=/usr/bin/python3
