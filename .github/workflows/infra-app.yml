name: AWS Migration CI/CD

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      break_glass_override:
        description: "Request governed break-glass override for blocked prod deployment"
        required: false
        default: false
        type: boolean
      break_glass_ticket:
        description: "Approved break-glass ticket/change ID"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY_PREFIX: cicd-sample
  DEPLOYMENT_DECISION_PARAM_PREFIX: /cicd/deployment-decisions

jobs:
  validate-build-scan:
    name: Validate, build, and security scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [weblogic, tomcat, python]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        if: matrix.app == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        if: matrix.app == 'python'
        run: pip install -r sample-code/python/requirements.txt

      - name: Run Python syntax check
        if: matrix.app == 'python'
        run: python -m py_compile sample-code/python/app.py

      - name: Build sample image
        run: docker build -t local/${{ matrix.app }}:${{ github.sha }} ./sample-code/${{ matrix.app }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: local/${{ matrix.app }}:${{ github.sha }}
          artifact-name: sbom-${{ matrix.app }}

      - name: Scan filesystem with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-${{ matrix.app }}.sarif

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.app }}.sarif

  iac-validate:
    name: Terraform and IaC policy checks
    runs-on: ubuntu-latest
    if: ${{ hashFiles('terraform/**/*.tf') != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform

  ansible-validate:
    name: Ansible lint and Molecule tests
    runs-on: ubuntu-latest
    if: ${{ hashFiles('ansible/**') != '' }}
    strategy:
      fail-fast: false
      matrix:
        scenario: [apache, tomcat]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible, Molecule, and lint tools
        run: |
          pip install \
            ansible>=9.0.0 \
            molecule[docker]>=24.0.0 \
            ansible-lint>=24.0.0 \
            docker>=7.0.0 \
            requests

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml
        working-directory: ${{ github.workspace }}

      - name: Run ansible-lint on roles
        run: ansible-lint roles/apache roles/tomcat
        working-directory: ansible

      - name: Run Molecule test scenario – ${{ matrix.scenario }}
        run: molecule test -s ${{ matrix.scenario }}
        working-directory: ansible
        env:
          MOLECULE_NO_LOG: "false"
          RELEASE_SHA: ${{ github.sha }}
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

  release-manifest:
    name: Create release manifest
    runs-on: ubuntu-latest
    needs: [validate-build-scan, iac-validate, ansible-validate]
    if: ${{ always() && needs.validate-build-scan.result == 'success' && (needs.iac-validate.result == 'success' || needs.iac-validate.result == 'skipped') && (needs.ansible-validate.result == 'success' || needs.ansible-validate.result == 'skipped') }}
    outputs:
      release_version: ${{ steps.manifest.outputs.release_version }}
    steps:
      - name: Create release manifest
        id: manifest
        run: |
          release_id="${GITHUB_SHA}"
          release_version="${GITHUB_SHA::12}"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          cat > release-manifest.json <<JSON
          {
            "releaseId": "$release_id",
            "releaseVersion": "$release_version",
            "commit": "${GITHUB_SHA}",
            "artifacts": {
              "containerImages": [
                "${ECR_REPOSITORY_PREFIX}/weblogic:${GITHUB_SHA}",
                "${ECR_REPOSITORY_PREFIX}/tomcat:${GITHUB_SHA}",
                "${ECR_REPOSITORY_PREFIX}/python:${GITHUB_SHA}"
              ],
              "amiParameterPaths": {
                "dev": "/dev/approved/ami/base",
                "test": "/test/approved/ami/base",
                "prod": "/prod/approved/ami/base"
              }
            },
            "mandatoryControls": {
              "secretScanning": "required",
              "iacPolicyChecks": "required",
              "imageSigning": "required",
              "immutableReleaseIdentity": "required",
              "noRedeployAfterFailure": "required"
            },
            "iac": {
              "path": "terraform",
              "version": "${GITHUB_SHA}"
            },
            "governance": {
              "promotionPath": ["dev", "test", "prod"],
              "overridePolicy": "default-deny",
              "generatedAt": "$(date -u +%FT%TZ)"
            }
          }
          JSON

      - name: Enforce immutable release identity policy
        run: |
          set -euo pipefail
          manifest_release_id="$(jq -r '.releaseId' release-manifest.json)"
          if [ -z "$manifest_release_id" ] || [ "$manifest_release_id" = "null" ]; then
            echo "Policy violation [CTRL-007-IMMUTABLE-RELEASE]: releaseId is required."
            exit 1
          fi
          if [ "$manifest_release_id" != "${GITHUB_SHA}" ]; then
            echo "Policy violation [CTRL-007-IMMUTABLE-RELEASE]: releaseId must equal immutable commit SHA."
            exit 1
          fi
          if jq -e '.artifacts.containerImages[] | test(":(latest|main|master|dev|develop|staging|stable)$")' release-manifest.json > /dev/null; then
            echo "Policy violation [CTRL-007-IMMUTABLE-IMAGE]: Mutable image tags are not permitted."
            exit 1
          fi
          sha_pinned_result="$(jq -r --arg sha "${GITHUB_SHA}" 'all(.artifacts.containerImages[]; endswith(":" + $sha))' release-manifest.json)"
          if [ "$sha_pinned_result" != "true" ]; then
            echo "Policy violation [CTRL-007-IMMUTABLE-IMAGE]: Container references must be pinned to the release SHA tag."
            exit 1
          fi

      - name: Enforce mandatory control declarations
        run: |
          set -euo pipefail
          required_controls=(secretScanning iacPolicyChecks imageSigning immutableReleaseIdentity noRedeployAfterFailure)
          for control in "${required_controls[@]}"; do
            value="$(jq -r --arg c "$control" '.mandatoryControls[$c]' release-manifest.json)"
            if [ "$value" != "required" ]; then
              echo "Policy violation [CTRL-007-MANDATORY-CONTROLS]: mandatory control '$control' is missing or disabled."
              exit 1
            fi
          done

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json

  deploy-dev:
    name: Deploy to dev
    runs-on: ubuntu-latest
    needs: [release-manifest]
    if: ${{ github.ref == 'refs/heads/main' && vars.AWS_DEV_ROLE_ARN != '' }}
    environment: dev
    steps:
      - name: Download release manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest

      - name: Configure AWS credentials (dev)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEV_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read release identity (dev)
        id: release_dev
        run: |
          release_id="$(jq -r '.releaseId' release-manifest.json)"
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "Policy violation [CTRL-007-RELEASE-ID]: releaseId is required for deployment."
            exit 1
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Enforce no re-deploy after failure (dev)
        run: |
          set -euo pipefail
          decision_param="${DEPLOYMENT_DECISION_PARAM_PREFIX}/${{ steps.release_dev.outputs.release_id }}/dev"
          decision_err="$(mktemp)"
          trap 'rm -f "$decision_err"' EXIT
          if decision="$(aws ssm get-parameter --name "$decision_param" --query 'Parameter.Value' --output text 2>"$decision_err")"; then
            echo "Existing decision record for dev release ${{ steps.release_dev.outputs.release_id }}: $decision"
          else
            if grep -q "ParameterNotFound" "$decision_err"; then
              echo "No existing decision record for dev release ${{ steps.release_dev.outputs.release_id }} (first deployment)."
              decision=""
            else
              echo "Policy violation [CTRL-007-DECISION-STORE]: unable to read decision record $decision_param."
              cat "$decision_err"
              exit 1
            fi
          fi
          if [ -n "$decision" ] && [ "$decision" != "passed" ] && [ "$decision" != "failed" ] && [ "$decision" != "blocked" ]; then
            echo "Policy violation [CTRL-007-DECISION-STORE]: unsupported decision value '$decision' in $decision_param."
            exit 1
          fi
          if [ "$decision" = "failed" ] || [ "$decision" = "blocked" ]; then
            echo "Policy violation [CTRL-007-NOREDEPLOY]: Release ${{ steps.release_dev.outputs.release_id }} is blocked in dev due to prior failure."
            echo "Override not permitted. Build and scan a new release identity."
            exit 1
          fi

      - name: Deploy dev (placeholder)
        id: deploy_dev
        run: |
          echo "Deploying release $(jq -r .releaseVersion release-manifest.json) to dev"
          echo "Use image digest pinning and apply Terraform dev variables"

      - name: Post-deploy smoke check (dev)
        run: echo "Run dev smoke checks"

      - name: Persist deployment decision (dev)
        if: ${{ always() }}
        run: |
          set -euo pipefail
          decision_param="${DEPLOYMENT_DECISION_PARAM_PREFIX}/${{ steps.release_dev.outputs.release_id }}/dev"
          outcome="failed"
          if [ "${{ steps.deploy_dev.outcome }}" = "success" ]; then
            outcome="passed"
          elif [ "${{ steps.deploy_dev.outcome }}" = "skipped" ]; then
            outcome="blocked"
          fi
          aws ssm put-parameter --name "$decision_param" --type String --value "$outcome" --overwrite

  deploy-test:
    name: Deploy to test
    runs-on: ubuntu-latest
    needs: [deploy-dev, release-manifest]
    if: ${{ github.ref == 'refs/heads/main' && vars.AWS_TEST_ROLE_ARN != '' }}
    environment: test
    steps:
      - name: Download release manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest

      - name: Configure AWS credentials (test)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TEST_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read release identity (test)
        id: release_test
        run: |
          release_id="$(jq -r '.releaseId' release-manifest.json)"
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "Policy violation [CTRL-007-RELEASE-ID]: releaseId is required for deployment."
            exit 1
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Enforce no re-deploy after failure (test)
        run: |
          set -euo pipefail
          decision_param="${DEPLOYMENT_DECISION_PARAM_PREFIX}/${{ steps.release_test.outputs.release_id }}/test"
          decision_err="$(mktemp)"
          trap 'rm -f "$decision_err"' EXIT
          if decision="$(aws ssm get-parameter --name "$decision_param" --query 'Parameter.Value' --output text 2>"$decision_err")"; then
            echo "Existing decision record for test release ${{ steps.release_test.outputs.release_id }}: $decision"
          else
            if grep -q "ParameterNotFound" "$decision_err"; then
              echo "No existing decision record for test release ${{ steps.release_test.outputs.release_id }} (first deployment)."
              decision=""
            else
              echo "Policy violation [CTRL-007-DECISION-STORE]: unable to read decision record $decision_param."
              cat "$decision_err"
              exit 1
            fi
          fi
          if [ -n "$decision" ] && [ "$decision" != "passed" ] && [ "$decision" != "failed" ] && [ "$decision" != "blocked" ]; then
            echo "Policy violation [CTRL-007-DECISION-STORE]: unsupported decision value '$decision' in $decision_param."
            exit 1
          fi
          if [ "$decision" = "failed" ] || [ "$decision" = "blocked" ]; then
            echo "Policy violation [CTRL-007-NOREDEPLOY]: Release ${{ steps.release_test.outputs.release_id }} is blocked in test due to prior failure."
            echo "Override not permitted. Build and scan a new release identity."
            exit 1
          fi

      - name: Deploy test (placeholder)
        id: deploy_test
        run: |
          echo "Deploying release $(jq -r .releaseVersion release-manifest.json) to test"
          echo "Run integration, DAST/smoke, and performance baseline checks"

      - name: Quality and security gate (test)
        run: echo "Block promotion if unresolved HIGH/CRITICAL findings exist"

      - name: Persist deployment decision (test)
        if: ${{ always() }}
        run: |
          set -euo pipefail
          decision_param="${DEPLOYMENT_DECISION_PARAM_PREFIX}/${{ steps.release_test.outputs.release_id }}/test"
          outcome="failed"
          if [ "${{ steps.deploy_test.outcome }}" = "success" ]; then
            outcome="passed"
          elif [ "${{ steps.deploy_test.outcome }}" = "skipped" ]; then
            outcome="blocked"
          fi
          aws ssm put-parameter --name "$decision_param" --type String --value "$outcome" --overwrite

  deploy-prod:
    name: Deploy to prod
    runs-on: ubuntu-latest
    needs: [deploy-test, release-manifest]
    if: ${{ github.ref == 'refs/heads/main' && vars.AWS_PROD_ROLE_ARN != '' }}
    environment: prod
    steps:
      - name: Download release manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest

      - name: Configure AWS credentials (prod)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read release identity (prod)
        id: release_prod
        run: |
          release_id="$(jq -r '.releaseId' release-manifest.json)"
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "Policy violation [CTRL-007-RELEASE-ID]: releaseId is required for deployment."
            exit 1
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Enforce no re-deploy after failure (prod)
        run: |
          set -euo pipefail
          decision_param="${DEPLOYMENT_DECISION_PARAM_PREFIX}/${{ steps.release_prod.outputs.release_id }}/prod"
          decision_err="$(mktemp)"
          trap 'rm -f "$decision_err"' EXIT
          if decision="$(aws ssm get-parameter --name "$decision_param" --query 'Parameter.Value' --output text 2>"$decision_err")"; then
            echo "Existing decision record for prod release ${{ steps.release_prod.outputs.release_id }}: $decision"
          else
            if grep -q "ParameterNotFound" "$decision_err"; then
              echo "No existing decision record for prod release ${{ steps.release_prod.outputs.release_id }} (first deployment)."
              decision=""
            else
              echo "Policy violation [CTRL-007-DECISION-STORE]: unable to read decision record $decision_param."
              cat "$decision_err"
              exit 1
            fi
          fi
          if [ -n "$decision" ] && [ "$decision" != "passed" ] && [ "$decision" != "failed" ] && [ "$decision" != "blocked" ]; then
            echo "Policy violation [CTRL-007-DECISION-STORE]: unsupported decision value '$decision' in $decision_param."
            exit 1
          fi
          if [ "$decision" = "failed" ] || [ "$decision" = "blocked" ]; then
            echo "Policy violation [CTRL-007-NOREDEPLOY]: Release ${{ steps.release_prod.outputs.release_id }} is blocked in prod due to prior failure."
            echo "Override not permitted. Build and scan a new release identity."
            exit 1
          fi

      - name: Enforce break-glass governance (prod)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.break_glass_override == true }}
        run: |
          set -euo pipefail
          if [ -z "${{ inputs.break_glass_ticket }}" ]; then
            echo "Policy violation [CTRL-007-BREAKGLASS]: break_glass_ticket is required."
            exit 1
          fi
          if [ "${{ vars.BREAK_GLASS_APPROVED }}" != "true" ]; then
            echo "Policy violation [CTRL-007-BREAKGLASS]: security approval variable BREAK_GLASS_APPROVED must be true."
            exit 1
          fi
          if [ -z "${{ vars.BREAK_GLASS_APPROVED_UNTIL }}" ]; then
            echo "Policy violation [CTRL-007-BREAKGLASS]: BREAK_GLASS_APPROVED_UNTIL must be set."
            exit 1
          fi
          now_epoch="$(date -u +%s)"
          if ! expiry_epoch="$(date -u -d "${{ vars.BREAK_GLASS_APPROVED_UNTIL }}" +%s 2>/dev/null)"; then
            echo "Policy violation [CTRL-007-BREAKGLASS]: BREAK_GLASS_APPROVED_UNTIL is not a valid UTC timestamp."
            exit 1
          fi
          if [ "$expiry_epoch" -le "$now_epoch" ]; then
            echo "Policy violation [CTRL-007-BREAKGLASS]: override approval window is expired."
            exit 1
          fi
          echo "Break-glass override accepted for ticket ${{ inputs.break_glass_ticket }} until ${{ vars.BREAK_GLASS_APPROVED_UNTIL }} UTC"

      - name: Deploy prod (placeholder)
        id: deploy_prod
        run: |
          echo "Deploying release $(jq -r .releaseVersion release-manifest.json) to prod"
          echo "Use blue/green or canary strategy with automatic health rollback"

      - name: Post-deploy verification (prod)
        run: echo "Run production verification and SLO checks"

      - name: Persist deployment decision (prod)
        if: ${{ always() }}
        run: |
          set -euo pipefail
          decision_param="${DEPLOYMENT_DECISION_PARAM_PREFIX}/${{ steps.release_prod.outputs.release_id }}/prod"
          outcome="failed"
          if [ "${{ steps.deploy_prod.outcome }}" = "success" ]; then
            outcome="passed"
          elif [ "${{ steps.deploy_prod.outcome }}" = "skipped" ]; then
            outcome="blocked"
          fi
          aws ssm put-parameter --name "$decision_param" --type String --value "$outcome" --overwrite

  rollback-prod:
    name: Rollback prod
    runs-on: ubuntu-latest
    needs: [deploy-prod]
    if: ${{ failure() && needs.deploy-prod.result == 'failure' && vars.AWS_PROD_ROLE_ARN != '' }}
    environment: prod
    steps:
      - name: Configure AWS credentials (prod)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PROD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger rollback strategy
        run: |
          echo "Rollback application to prior healthy target group/task set"
          echo "Rollback ASG/Launch Template to previous approved AMI"
          echo "Apply controlled Terraform revert if infra drift/change failed"

  remediation-notify:
    name: Open remediation incident
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-test, deploy-prod]
    if: ${{ always() && (needs.deploy-dev.result == 'failure' || needs.deploy-test.result == 'failure' || needs.deploy-prod.result == 'failure') }}
    steps:
      - name: Create remediation payload
        run: |
          echo "Open ServiceNow remediation ticket for failed deployment control."
          echo "Attach release manifest, failed control ID, and gate evidence from this run."
